<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>青パトスケジュール</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h2>さくら坂３丁目　青色パトロール　巡回担当表</h2>

  <!-- アクセスした日付を表示 -->
  <div id="currentDate" style="font-size: 18px; margin-bottom: 10px; font-weight: bold;"></div>

  <!-- スプレッドシートの内容を描画する表 -->
  <table>
    <tbody id="sheetBody"></tbody>
  </table>

  <!-- 注意書き -->
  <p>※自身の名前を入力してください。</p>
  <p>※同時に入力されると、後の方が優先される可能性があります。</p>
  <p>※入力後のロック機能はありません。</p>

  <!-- ★ 送信ボタンはここに固定配置（表の外） -->
  <div style="text-align:center; margin-top:10px;">
    <button id="sendBtn" class="inline-send-btn">送信</button>
  </div>
<div id="loadingDialog" class="dialog" style="display:none;">
  <div class="dialog-content">
    <p id="dialogMessage">送信中です。少しお待ちください。</p>
  </div>
</div>

<style>
.dialog {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}
.dialog-content {
  background: white;
  padding: 20px 30px;
  border-radius: 8px;
  font-size: 18px;
  text-align: center;
}
</style>

  <!-- スクリプト -->
  <script src="script.js"></script>

</body>
</html>
